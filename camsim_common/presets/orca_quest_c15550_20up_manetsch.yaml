schema_version: '1.0'
name: orca_quest_c15550_20up_manetsch
camera: Hamamatsu ORCA-Quest C15550-20UP
mode: as used by Manetsch et al. (scan mode not stated)
sensor_type: qCMOS
notes: Validation preset V1. Output treated in photoelectron units, as in the paper's histograms.
qe:
  wavelength_nm:
  - 852.35
  temperature_K:
  - 293.15
  values:
  - - 0.44
  prov:
    value: single point
    unit: ''
    prov: SOURCE
    pointer: 'Manetsch et al., arXiv:2403.12021v4, Methods ''Single-atom imaging'': ''44% are detected on the sensor
      due to the quantum efficiency at 852 nm'''
    note: ''
qe_780:
  value: null
  unit: ''
  prov: PLACEHOLDER
  pointer: ''
  note: not used in V1
qe_852:
  value: 0.44
  unit: ''
  prov: SOURCE
  pointer: Manetsch et al., arXiv:2403.12021v4, Methods 'Single-atom imaging'
  note: ''
prnu:
  value: 0.0
  unit: ''
  prov: PLACEHOLDER
  pointer: ''
  note: not stated; effect on V1 tested in the sensitivity table
