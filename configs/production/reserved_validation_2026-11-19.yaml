# Reserved validation points and pass criteria for the production Sobol sweeps
# (configs/production/sobol.yaml, 10240 rows; configs/production/sobol_camera.yaml, 8192 rows).
# Written 2026-11-19 and committed before the remaining rows of either design are run
# (CLAUDE.md rules 10 and 13). Do not edit criteria after any reserved point has been evaluated;
# append a dated amendment instead.
#
# Status at writing (disclosed, not hidden):
#  - The nested N = 256 prefixes were already evaluated before this file existed: rows 0-2559 of
#    sobol.yaml and rows 0-2047 of sobol_camera.yaml (runs/production/sweeps_measpsf.log), and their
#    indices were read (reports/p1_sobol_interim_n256.md, reports/p1_sobol_camera_n256.md). This file
#    therefore precedes only the remaining rows. The reserved points below are new, never evaluated,
#    and are not rows of either design (smallest normalised distance to a design row: 0.11).
#  - No held-out MEASURED data exist for the production sweep. The reference scenario is anchored on
#    V1 (reports/contact_log_v1_v2.md, entries P-1 to P-6), so V1 cannot validate it. The reserved
#    points are validated against independent numerical routes and grid refinement, not against data.
#  - The checker for R1 to R3 is not yet written. It must pass its own negative control (R5) before
#    its output on the reserved points is read.
#  - Timing (CLAUDE.md rule 14): the cost figures in runs/production/slurm_submit_measpsf.sh were
#    measured in the cloud container. A pilot on the cluster is required before full submission.

date: 2026-11-19
generator:
  random_points: "numpy.random.default_rng(20261119), numpy 2.5.3; per parameter u ~ U(0,1) mapped to the range of the
    problem file (log-uniform where log: true), camera design drawn first (6 points), then the 8-parameter design (6 points);
    values rounded to 4 significant digits; the rounded values are the definition"
  corner_points: "chosen by rule before any evaluation: best camera, worst camera, under-sampled, over-sampled with
    maximal read-noise tail; NA and loss at their extremes (best, worst) or at the reference (0.55, 2.35e-8)"

camera_design:            # configs/production/sobol_camera_problem.yaml; fixed block of sobol_camera.yaml
