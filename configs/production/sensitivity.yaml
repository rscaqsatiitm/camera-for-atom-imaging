# Production study 3: sensitivity of the preset results to uncertain inputs (explicit points).
# Each row of points_file is (case, px_per_fwhm); the evaluator below maps 'case' to the change.
name: prod_sensitivity
seed: 5007
evaluator: p1_atomdet.sweep.evaluate:production_sensitivity_point
fixed:
  scenario_file: configs/production/reference_cs.yaml
  targets: [1.0e-3, 1.0e-4]
  eps_at_ms: [40]
  pc_frame_rate_hz: 670.0
  p_loss_high: {value: 5.6e-7, unit: "", prov: DERIVED, pointer: "Picken et al. arXiv:1709.00946v2: retention > 99% per 40 ms image at 450 photons/ms -> p <= 0.01/18000"}
axes:
  case: [base_bsi, bsi_tail2pct, bsi_qe_lo, bsi_qe_hi, bsi_loss_high, base_q2pnr, q2pnr_loss_high,
         ixon_pc_freg0, ixon_pc_freg1, ixon_an_freg0, ixon_an_freg1, base_bfs, bfs_loss_high]
  px_per_fwhm: [1.0, 1.4]
