# Production study 1: camera presets in the reference scenario, at five pixel samplings.
name: prod_presets
seed: 5005
evaluator: p1_atomdet.sweep.evaluate:production_preset_point
fixed:
  scenario_file: configs/production/reference_cs.yaml
  targets: [1.0e-3, 1.0e-4]
  eps_at_ms: [20, 40, 80]
  pc_frame_rate_hz: 670.0      # USER iXon Ultra sheet: 128x128 crop mode, 1x1 binning, 670 fps
axes:
  preset: [orca_quest2_std, orca_quest2_uq_pnr, prime_bsi_express_cms, prime_bsi_express_speed, zyla55_global_200MHz,
           ixon888_exf_analog, ixon888_exf_pc, orca_fusion_bt_uq, marana_42b6_lownoise, qhy268m_imx571_hg2cms,
           blackfly_s_bfs_u3_17s7m_hcg]
  px_per_fwhm: [0.7, 1.0, 1.4, 2.0, 3.0]
