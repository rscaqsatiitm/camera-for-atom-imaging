# V1: reproduce Manetsch et al., arXiv:2403.12021v4 (Cs, ORCA-Quest C15550-20UP, 80 ms).
name: v1_manetsch
seed: 1001
sensor_preset: camsim_common/presets/orca_quest_c15550_20up_manetsch.yaml

fixed:
  qe:            {value: 0.44, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods, Single-atom imaging"}
  eta_cam:       {value: 0.027, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: 'around 2.7% of scattered photons entering the camera, of which 44% are detected' (2.7% excludes QE)"}
  t_exp_s:       {value: 0.080, unit: s, prov: SOURCE, pointer: "arXiv:2403.12021v4 main text and Methods"}
  filling:       {value: 0.512, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 main text: loading probability 51.2%"}
  magnification: {value: 5.1, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: total magnification 5.1"}
  box_px:        {value: 7, unit: px, prov: SOURCE, pointer: "arXiv:2403.12021v4: 7x7-pixel box around each site"}
  psf_waist_px:  {value: 1.7, unit: px, prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: averaged PSF waist radius 1.7 px (sd 0.2 px)"}
  survival_imaging: {value: 0.999864, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: model-free S = 0.999864(2)"}
  survival_steady:  {value: 0.9998952, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Fig. 3b: p1 = 0.9998952(1)"}
  vacuum_lifetime_s: {value: 1374.0, unit: s, prov: SOURCE, pointer: "arXiv:2403.12021v4 main text: 1/e lifetime 22.9(1) min"}

data:   # digitised from the figures (method: pixel column heights of the histogram bars, see report Sec. 3.1)
  bg_mean:   {value: 18.66, unit: photons, prov: DATA, pointer: "Ext. Data Fig. 4b digitised (400 dpi render), unweighted 7x7 box"}
  bg_sd:     {value: 4.40, unit: photons, prov: DATA, pointer: "Ext. Data Fig. 4b digitised"}
  atom_mean: {value: 87.40, unit: photons, prov: DATA, pointer: "Ext. Data Fig. 4b digitised"}
  atom_sd:   {value: 13.22, unit: photons, prov: DATA, pointer: "Ext. Data Fig. 4b digitised"}
  rate_mean_kcps: {value: 69.74, unit: kc/s, prov: DATA, pointer: "Ext. Data Fig. 4d digitised"}
  rate_sd_kcps:   {value: 8.55, unit: kc/s, prov: DATA, pointer: "Ext. Data Fig. 4d digitised (site-to-site)"}

targets:
  fidelity:  {value: 0.9999374, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: F = 0.9999374(8)", note: "uncertainty 8e-7"}
  fp:        {value: 7.01e-5, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: 1 - F0 = 7.01(8)e-5"}
  fn:        {value: 5.5e-5, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: 1 - F1 = 5.5(1)e-5"}
  fidelity_no_loss: {value: 0.99999, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Methods: 99.999(1)% (lossy Poisson model, loss set to zero)"}
  fidelity_20ms: {value: 0.999571, unit: "", prov: SOURCE, pointer: "arXiv:2403.12021v4 Ext. Data Fig. 6: 99.9571(4)% at 20 ms, Delta = -9.5 Gamma"}

numerics:
  n_tau: 48
  ds: 0.01
  supersample: 8
  readout_variants: [analog_adc, pnr]
  is_samples: 400000

# Loss model B: two regimes with measurable loss; only the loss-time SHAPE is transferred to the
# measured survival (report Sec. 2.1). Trap depth from the paper; waist and cooling are assumptions.
model_b:
  n_atoms: 4000
  n_bins: 20
  base:
    U0_K:      {value: 1.8e-4, unit: K, prov: SOURCE, pointer: "arXiv:2403.12021v4 main text: average trap depth kB x 0.18(2) mK"}
    w0_m:      {value: 5.5e-7, unit: m, prov: PLACEHOLDER, note: "~ lambda/(pi NA) for 1061 nm, NA 0.65; tweezer waist not stated"}
    zR_m:      {value: 9.0e-7, unit: m, prov: PLACEHOLDER, note: "pi w0^2/lambda"}
    rate_s:    {value: 72000.0, unit: s^-1, prov: DERIVED, pointer: "implied scattering rate of the V1 fit (report Table V1-a)"}
    gamma_c_s: {value: 10000.0, unit: s^-1, prov: PLACEHOLDER, note: "PGC damping rate, assumed"}
    T_eq_K:    {value: 1.0e-5, unit: K, prov: PLACEHOLDER, note: "thermostat temperature chosen to give measurable loss (shape study only)"}
    T_init_K:  {value: 2.0e-5, unit: K, prov: PLACEHOLDER, note: "initial temperature, assumed"}
    t_exp_s:   0.08
    dt_s:      5.0e-7
    cooled_axes: [1, 1, 1]
  regimes:
    thermostat: {}                                  # escape from a cooled equilibrium: ~uniform loss in time
    heating: {rate_s: 7000.0, gamma_c_s: 0.0}       # uncooled recoil heating: loss concentrated late
